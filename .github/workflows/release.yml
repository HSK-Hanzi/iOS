name: Release

# Pushing a version tag archives the app, uploads it to App Store Connect, writes the version's
# release notes, and attaches the build to the version once Apple has processed it. Submitting for
# review is the only step left by hand.
#
# Re-tagging a version is how you replace its build: the tag push runs all of this again, and the
# version ends up pointing at the newer build. The older one stays on App Store Connect, since a
# build can be expired but never deleted.
#
# Nothing here re-runs the tests: tag a commit CI has already passed.
on:
  push:
    tags: ["[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version to build and upload.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: RISCfuture/XCUITestKit/.github/workflows/ios-release.yml@main
    with:
      platforms: '["iOS","macOS","visionOS"]'
      version: ${{ inputs.version || github.ref_name }}
      certificates-repo: RISCfuture/certificates
      # A Release build reads only the open-licensed data — INCLUDE_LICENSED_DICTIONARIES is set in
      # the Debug configuration alone — so Data/Proprietary stays absent and needs no key. Data/Open
      # is public, so rewrite its SSH submodule URL to anonymous HTTPS before initialising it.
      post-checkout-run: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule update --init Data/Open
        git -C Data/Open lfs pull
    secrets:
      certificates-token: ${{ secrets.CERTIFICATES_TOKEN }}
      match-password: ${{ secrets.MATCH_PASSWORD }}
      sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # Apple takes minutes to hours to process an upload, and a version cannot hold a build that is
  # still processing — so this waits the archives out rather than running with them. It attaches
  # whichever build is newest for the version, which on a re-tag is the one this run just uploaded.
  attach-build:
    name: Attach build
    needs: release
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Only for `bin/api-key`: attaching a build signs nothing.
      - name: Check out signing credentials
        uses: actions/checkout@v6
        with:
          repository: RISCfuture/certificates
          token: ${{ secrets.CERTIFICATES_TOKEN }}
          path: .certificates

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true

      - name: Attach the build to its version
        env:
          CERTIFICATES_REPO: ${{ github.workspace }}/.certificates
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: bundle exec fastlane ci_attach_build version:"$VERSION"

  # Runs after the builds so the notes land on a version that already has something to release. The
  # lane creates the version if the tag got there first, so this is also what opens 1.x for editing
  # when nobody has by hand.
  release-notes:
    name: Release notes
    needs: release
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Only for `bin/api-key`: the notes are metadata, so nothing here is signed.
      - name: Check out signing credentials
        uses: actions/checkout@v6
        with:
          repository: RISCfuture/certificates
          token: ${{ secrets.CERTIFICATES_TOKEN }}
          path: .certificates

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true

      - name: Publish release notes
        env:
          CERTIFICATES_REPO: ${{ github.workspace }}/.certificates
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: bundle exec fastlane ci_release_notes version:"$VERSION"
