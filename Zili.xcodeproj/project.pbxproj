/* Begin PBXShellScriptBuildPhase section */
		4077CCF52F6490507C3BCBAF /* Copy Data Resources */ = {
			isa = PBXShellScriptBuildPhase;
			inputPaths = (
				"$(SRCROOT)/Tools/generate_db.py",
				"$(SRCROOT)/Data/Open/CEDICT.plist",
				"$(SRCROOT)/Data/Open/SUBTLEX-CH-Words.plist",
				"$(SRCROOT)/Data/Open/CharacterReadings.plist",
				"$(SRCROOT)/Data/Open/CharacterEtymology.plist",
				"$(SRCROOT)/Data/Open/CharacterFrequency.plist",
				"$(SRCROOT)/Data/Open/HanziStrokeOrder.plist",
				"$(SRCROOT)/Data/Open/HSKVocabulary.plist",
				"$(SRCROOT)/Data/Open/PracticeSentences.plist",
			);
			name = "Copy Data Resources";
			outputPaths = (
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/CEDICT.sqlite",
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/SUBTLEX-CH-Words.sqlite",
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/HanziStrokeOrder.sqlite",
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Characters.sqlite",
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/HSKVocabulary.plist",
				"$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/PracticeSentences.plist",
			);
			shellPath = /bin/sh;
			shellScript = (
				"set -eu",
				"# Bundles the app's data from the non-synchronized Data/ tree. Word dictionaries, word frequency,",
				"# stroke order, and character data are converted to prebuilt SQLite databases (generated once,",
				"# cached by timestamp) so the app queries them on disk; the HSK syllabus stays a plist. Open data",
				"# is always included; licensed dictionaries only when INCLUDE_LICENSED_DICTIONARIES is set (Debug).",
				"DEST=\"${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"",
				"GEN=\"${SRCROOT}/Tools/generate_db.py\"",
				"OPEN=\"${SRCROOT}/Data/Open\"",
				"LICENSED=\"${SRCROOT}/Data/Proprietary\"",
				"FREQUENCY_PLIST=\"${OPEN}/SUBTLEX-CH-Words.plist\"",
				"READINGS_PLIST=\"${OPEN}/CharacterReadings.plist\"",
				"mkdir -p \"${DEST}\"",
				"",
				"# outdated <dest> <src...> — true when dest is missing or older than the generator or any source.",
				"outdated() {",
				"  dest=\"$1\"",
				"  shift",
				"  [ -e \"${dest}\" ] || return 0",
				"  [ \"${GEN}\" -nt \"${dest}\" ] && return 0",
				"  for src in \"$@\"; do",
				"    [ \"${src}\" -nt \"${dest}\" ] && return 0",
				"  done",
				"  return 1",
				"}",
				"",
				"# copy_plist <src> — bundles a plist as-is (like the HSK syllabus and the sentence corpora),",
				"# refreshing the copy only when the source is newer. A missing source is skipped, not an error.",
				"copy_plist() {",
				"  src=\"$1\"",
				"  name=\"$(basename \"${src}\")\"",
				"  [ -e \"${src}\" ] || return 0",
				"  if [ ! -e \"${DEST}/${name}\" ] || [ \"${src}\" -nt \"${DEST}/${name}\" ]; then",
				"    cp -f \"${src}\" \"${DEST}/${name}\"",
				"    echo \"note: bundled data ${name}\"",
				"  fi",
				"}",
				"",
				"# Word frequency ranks are folded into every dictionary, so dictionaries depend on the frequency",
				"# plist as well as their own source.",
				"gen_dictionary() {",
				"  base=\"$(basename \"$1\" .plist)\"",
				"  out=\"${DEST}/${base}.sqlite\"",
				"  if outdated \"${out}\" \"$1\" \"${FREQUENCY_PLIST}\" \"${READINGS_PLIST}\"; then",
				"    /usr/bin/env python3 \"${GEN}\" dictionary \"$1\" \"${out}\" --frequency \"${FREQUENCY_PLIST}\" --readings \"${READINGS_PLIST}\"",
				"    rm -f \"${DEST}/${base}.plist\"",
				"    echo \"note: generated ${base}.sqlite\"",
				"  fi",
				"}",
				"",
				"gen_dictionary \"${OPEN}/CEDICT.plist\"",
				"",
				"out=\"${DEST}/SUBTLEX-CH-Words.sqlite\"",
				"if outdated \"${out}\" \"${FREQUENCY_PLIST}\"; then",
				"  /usr/bin/env python3 \"${GEN}\" frequency \"${FREQUENCY_PLIST}\" \"${out}\"",
				"  rm -f \"${DEST}/SUBTLEX-CH-Words.plist\"",
				"  echo \"note: generated SUBTLEX-CH-Words.sqlite\"",
				"fi",
				"",
				"out=\"${DEST}/HanziStrokeOrder.sqlite\"",
				"if outdated \"${out}\" \"${OPEN}/HanziStrokeOrder.plist\"; then",
				"  /usr/bin/env python3 \"${GEN}\" strokes \"${OPEN}/HanziStrokeOrder.plist\" \"${out}\"",
				"  rm -f \"${DEST}/HanziStrokeOrder.plist\"",
				"  echo \"note: generated HanziStrokeOrder.sqlite\"",
				"fi",
				"",
				"out=\"${DEST}/Characters.sqlite\"",
				"if outdated \"${out}\" \"${OPEN}/CharacterReadings.plist\" \"${OPEN}/CharacterEtymology.plist\" \"${OPEN}/CharacterFrequency.plist\"; then",
				"  /usr/bin/env python3 \"${GEN}\" characters \\",
				"    \"${OPEN}/CharacterReadings.plist\" \"${OPEN}/CharacterEtymology.plist\" \\",
				"    \"${OPEN}/CharacterFrequency.plist\" \"${out}\"",
				"  rm -f \"${DEST}/CharacterReadings.plist\" \"${DEST}/CharacterEtymology.plist\" \\",
				"    \"${DEST}/CharacterFrequency.plist\"",
				"  echo \"note: generated Characters.sqlite\"",
				"fi",
				"",
				"copy_plist \"${OPEN}/HSKVocabulary.plist\"",
				"copy_plist \"${OPEN}/PracticeSentences.plist\"",
				"",
				"case \" ${SWIFT_ACTIVE_COMPILATION_CONDITIONS:-} \" in",
				"  *\" INCLUDE_LICENSED_DICTIONARIES \"*)",
				"    if [ -e \"${LICENSED}/HSKSentences.plist\" ]; then",
				"      copy_plist \"${LICENSED}/HSKSentences.plist\"",
				"      for f in \"${LICENSED}\"/*.plist; do",
				"        [ -e \"${f}\" ] || continue",
				"        [ \"$(basename \"${f}\")\" = \"HSKSentences.plist\" ] && continue",
				"        gen_dictionary \"${f}\"",
				"      done",
				"    else",
				"      echo \"note: proprietary data absent (Data/Proprietary not checked out); building open-only\"",
				"    fi",
				"    ;;",
				"esac",
				"",
			);
		};
		5E17A9000000000000000004 /* Upload Debug Symbols to Sentry */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			inputPaths = (
				"${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}",
			);
			name = "Upload Debug Symbols to Sentry";
			runOnlyForDeploymentPostprocessing = 1;
			shellPath = /bin/sh;
			shellScript = (
				"# Uploads debug symbols and source context to Sentry so production crash reports symbolicate.",
				"if [[ \"$(uname -m)\" == arm64 ]]; then",
				"  export PATH=\"/opt/homebrew/bin:$PATH\"",
				"fi",
				"",
				"if which sentry-cli >/dev/null; then",
				"  export SENTRY_ORG=timcodes",
				"  export SENTRY_PROJECT=zili",
				"  ERROR=$(sentry-cli debug-files upload --include-sources \"$DWARF_DSYM_FOLDER_PATH\" 2>&1 >/dev/null)",
				"  if [ ! $? -eq 0 ]; then",
				"    echo \"warning: sentry-cli - $ERROR\"",
				"  fi",
				"else",
				"  echo \"warning: sentry-cli not installed, download from https://github.com/getsentry/sentry-cli/releases\"",
				"fi",
				"",
			);
		};
